<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>G2P for Metro</title>
    <style>
      /* 서울 지하철 노선도의 종이 바탕과 노선 색. 색은 데이터이지 장식이 아니다. */
      :root {
        --paper: #f7f5f0;
        --ink: #14161a;
        --quiet: #71757c;
        --rule: #ddd8cf;
        --field: #fffefb;
        --warn: #b4341f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #17191c;
          --ink: #eceef0;
          --quiet: #8b9199;
          --rule: #2b2f34;
          --field: #202327;
          --warn: #e8705c;
        }
      }
      * { box-sizing: border-box }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      #app { max-width: 420px; margin: 0 auto; padding: 32px 20px 48px }

      h1 { font-size: 22px; font-weight: 640; letter-spacing: -0.02em; margin: 0 }
      .sub { margin: 4px 0 0; font-size: 14px; color: var(--quiet) }

      ul { list-style: none; margin: 24px 0 0; padding: 0; border-top: 1px solid var(--rule) }
      li {
        display: flex; align-items: center; gap: 10px;
        padding: 13px 2px; border-bottom: 1px solid var(--rule);
      }
      .name { font-size: 17px; font-weight: 560; letter-spacing: -0.01em }
      .badges { display: flex; gap: 4px; margin-left: auto }
      .badge {
        font-size: 11px; font-weight: 700; color: #fff;
        padding: 2px 7px; border-radius: 9px; white-space: nowrap;
      }
      .missing .name { color: var(--quiet) }
      .why { font-size: 13px; color: var(--warn); margin-left: auto }
      .drop {
        border: 0; background: none; color: var(--quiet); font-size: 20px;
        padding: 0 4px; cursor: pointer; line-height: 1;
      }
      .drop:hover, .drop:focus-visible { color: var(--ink) }

      .empty { padding: 28px 2px; color: var(--quiet); font-size: 15px; border-bottom: 1px solid var(--rule) }

      form { display: flex; gap: 8px; margin-top: 20px }
      input {
        flex: 1; font: inherit; font-size: 16px; padding: 11px 13px;
        background: var(--field); color: var(--ink);
        border: 1px solid var(--rule); border-radius: 10px;
      }
      input:focus-visible { outline: 2px solid var(--ink); outline-offset: -1px }
      form button {
        font: inherit; font-size: 15px; font-weight: 560; padding: 0 16px;
        background: var(--ink); color: var(--paper);
        border: 0; border-radius: 10px; cursor: pointer;
      }
      form button:disabled { opacity: .35; cursor: default }

      .hits { margin: 8px 0 0; padding: 0; list-style: none; border-top: 0 }
      .hits li { border-bottom: 1px dashed var(--rule); padding: 11px 2px; cursor: pointer }
      .hits li:hover, .hits li:focus-visible { background: var(--field) }

      .note { margin: 22px 0 0; font-size: 13px; color: var(--quiet); line-height: 1.6 }
      details { margin: 28px 0 0; border-top: 1px solid var(--rule); padding-top: 14px }
      summary { font-size: 13px; color: var(--quiet); cursor: pointer; list-style: none }
      summary::-webkit-details-marker { display: none }
      summary::before { content: '▸ '; }
      details[open] summary::before { content: '▾ '; }
      pre {
        margin: 12px 0 0; padding: 10px; max-height: 260px; overflow: auto;
        background: var(--field); border: 1px solid var(--rule); border-radius: 8px;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap; word-break: break-all; color: var(--quiet);
      }
      .tools { display: flex; gap: 8px; margin-top: 10px }
      .tools button {
        flex: 1; font: inherit; font-size: 13px; padding: 9px 0;
        background: none; color: var(--ink);
        border: 1px solid var(--rule); border-radius: 8px; cursor: pointer;
      }
      .tools button:active { background: var(--field) }
      .version {
        margin: 40px 0 0; text-align: center;
        font-size: 12px; color: var(--quiet); letter-spacing: 0.02em;
      }
      @media (prefers-reduced-motion: no-preference) {
        li { transition: background .12s ease }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>자주 가는 곳</h1>
      <p class="sub" id="count"></p>

      <ul id="list"></ul>

      <form id="add" autocomplete="off">
        <input id="q" placeholder="역 이름" inputmode="text" enterkeyhint="done" />
        <button id="go" disabled>추가</button>
      </form>
      <ul class="hits" id="hits"></ul>

      <p class="note" id="note"></p>

      <details id="diag">
        <summary>진단 기록</summary>
        <pre id="logview">기록이 없습니다.</pre>
        <div class="tools">
          <button id="refresh" type="button">새로고침</button>
          <button id="send" type="button">서버로 보내기</button>
        </div>
        <p class="note" id="sent"></p>
      </details>

      <p class="version" id="version"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
