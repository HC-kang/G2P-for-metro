name = "metro"
main = "index.js"
compatibility_date = "2026-09-01"

# 커스텀 도메인은 쓰지 않는다. 기본 *.workers.dev 주소를 쓴다.
workers_dev = true

# secret은 파일에 두지 않는다. wrangler secret put 으로 넣는다.
#   npx wrangler secret put SEOUL_RT_KEY
#   npx wrangler secret put METRO_TOKEN

# 로그를 Cloudflare가 보존한다. 단, 보존 로그는 wrangler OAuth로는 읽을 수 없다(대시보드만). 그래서 아래 D1을 따로 둔다.
# wrangler tail은 실시간 스트림이라 붙어 있지 않으면 로그가 사라진다.
# 이것을 켜면 대시보드와 `wrangler tail --format json` 없이도 나중에 조회할 수 있다.
[observability]
enabled = true
head_sampling_rate = 1

# 기기 로그 저장소. 개발 기간 동안 앱이 10초마다 보내는 묶음과 "서버로 보내기" 묶음을 모두 저장한다(14일).
# tail은 몇 시간 뒤 조용히 끊겨 있곤 했고, KV는 하루 쓰기 1000번이 한도라 10초 묶음을 못 받는다.
# 표: schema.sql. 읽기: scripts/logs.sh
[[d1_databases]]
binding = "DB"
database_name = "metro-logs"
database_id = "680c8dae-dc44-48c4-bf66-5ef8a75b393d"
